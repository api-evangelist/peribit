name: Peribit
description: >-
  Peribit (Peribit Networks) was a wide-area network (WAN) acceleration and
  optimization company backed by Mayfield. It built appliances that reduced
  bandwidth consumption and accelerated application performance across
  enterprise WAN links. Peribit Networks was acquired by Juniper Networks in
  2005 and is listed as an exited "Milestone" company in the Mayfield
  portfolio. The company is defunct: it has no active corporate website,
  developer portal, public API, SDKs, or other machine-readable surface. This
  API Evangelist profile was created as a VC-portfolio stub for enrichment; the
  enrichment pass confirmed there is no live API or developer surface to
  catalog.
